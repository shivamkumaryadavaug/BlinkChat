name: Build Android APK

# Run manually from the Actions tab whenever you want a fresh APK,
# and also automatically whenever you push changes to frontend/.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build web app
        working-directory: frontend
        env:
          # This must match your production backend URL.
          VITE_SERVER_URL: https://blinkchat-backend-nghz.onrender.com
        run: npm run build

      - name: Install Capacitor
        working-directory: frontend
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Init Capacitor (skip if already configured)
        working-directory: frontend
        run: |
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then
            npx cap init "BlinkChat" "com.blinkchat.app" --web-dir=build
          fi

      - name: Add Android platform (skip if already added)
        working-directory: frontend
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync web build into Android project
        working-directory: frontend
        run: npx cap sync android

      - name: Grant execute permission to gradlew
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: blinkchat-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Fix Kotlin stdlib version conflict
        run: |
          cat >> android/build.gradle << 'EOF'

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          EOF
